services:
  db:
    image: postgres:16
    container_name: stokvel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stokvel
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:16
    container_name: stokvel-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stokvel_test
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  ledger:
    build:
      context: ./services/ledger
      dockerfile: Dockerfile
    container_name: stokvel-ledger
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./services/ledger/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/stokvel
    ports:
      - "8001:8080"

volumes:
  postgres_data:
